name = "brf-korat-studio"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# ============================================================================
# การเชื่อมต่อฐานข้อมูล Cloudflare KV (Key-Value Database)
# เมื่อสร้าง KV Namespace ในหน้าเว็บ Cloudflare Dashboard แล้ว
# ให้นำ ID มาใส่แทนที่ "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" ด้านล่าง
# หรือผูกผ่านหน้าเว็บ Cloudflare Pages -> Settings -> Bindings -> Add KV Namespace
# โดยตั้งชื่อ Variable name ว่า: BRF_STUDIO_KV
# ============================================================================
[[kv_namespaces]]
binding = "BRF_STUDIO_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
ADMIN_PIN = "1234"
